<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ORIOLE — Recuperar contraseña</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="center-screen">
    <div class="auth-card">
      <h1>ORIOLE</h1>
      <p class="subtitle">Recuperación de contraseña</p>

      <p style="font-size:13px;color:var(--color-text-muted);margin-bottom:16px">
        Ingresa tu correo registrado. Te enviaremos un enlace válido por 30 minutos
        para restablecer tu contraseña.
      </p>

      <form onsubmit="event.preventDefault(); alert('Correo enviado (mock)')">
        <div class="field">
          <label>Correo electrónico</label>
          <input type="email" value="usuario@editorial.com">
        </div>

        <button class="btn btn-primary" style="width:100%;justify-content:center;padding:10px;margin-top:16px">
          Enviar enlace
        </button>

        <p style="text-align:center;margin-top:16px">
          <a href="login.html" style="font-size:13px">← Volver al inicio de sesión</a>
        </p>
      </form>
    </div>
  </div>
</body>
</html>
