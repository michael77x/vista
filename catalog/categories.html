<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ORIOLE — Categorías</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    .tree { list-style: none; padding-left: 16px; }
    .tree li { padding: 6px 0; border-left: 2px solid var(--color-border); padding-left: 12px; margin-left: 4px; }
    .tree .row { display: flex; justify-content: space-between; align-items: center; }
    .tree .row .name { font-weight: 500; }
  </style>
</head>
<body data-active="categories" data-title="Catálogo · Categorías" data-depth="1">

  <div class="page-header">
    <div>
      <div class="breadcrumb"><a href="../dashboard.html">Inicio</a> · Catálogo · Categorías</div>
      <h1>Categorías</h1>
    </div>
    <button class="btn btn-primary">+ Nueva categoría</button>
  </div>

  <div class="row">
    <div class="col card" style="min-width:320px">
      <h3>Estructura jerárquica</h3>
      <ul class="tree" style="padding-left:0">
        <li>
          <div class="row"><span class="name">📚 Ficción</span><span><span class="badge info">512</span> <button class="btn btn-sm">Editar</button></span></div>
          <ul class="tree">
            <li><div class="row"><span class="name">Novela</span><span><span class="badge info">312</span> <button class="btn btn-sm">Editar</button></span></div></li>
            <li><div class="row"><span class="name">Cuento</span><span><span class="badge info">98</span> <button class="btn btn-sm">Editar</button></span></div></li>
            <li><div class="row"><span class="name">Poesía</span><span><span class="badge info">52</span> <button class="btn btn-sm">Editar</button></span></div></li>
            <li><div class="row"><span class="name">Teatro</span><span><span class="badge info">50</span> <button class="btn btn-sm">Editar</button></span></div></li>
          </ul>
        </li>
        <li>
          <div class="row"><span class="name">📖 No ficción</span><span><span class="badge info">421</span> <button class="btn btn-sm">Editar</button></span></div>
          <ul class="tree">
            <li><div class="row"><span class="name">Ensayo</span><span><span class="badge info">142</span> <button class="btn btn-sm">Editar</button></span></div></li>
            <li><div class="row"><span class="name">Biografía</span><span><span class="badge info">87</span> <button class="btn btn-sm">Editar</button></span></div></li>
            <li><div class="row"><span class="name">Historia</span><span><span class="badge info">112</span> <button class="btn btn-sm">Editar</button></span></div></li>
            <li><div class="row"><span class="name">Filosofía</span><span><span class="badge info">80</span> <button class="btn btn-sm">Editar</button></span></div></li>
          </ul>
        </li>
        <li><div class="row"><span class="name">🎓 Académico</span><span><span class="badge info">214</span> <button class="btn btn-sm">Editar</button></span></div></li>
        <li><div class="row"><span class="name">🧒 Infantil y juvenil</span><span><span class="badge info">100</span> <button class="btn btn-sm">Editar</button></span></div></li>
      </ul>
    </div>

    <div class="col card">
      <h3>Editar categoría</h3>
      <div class="form-grid">
        <div class="field"><label>Nombre *</label><input value="Novela"></div>
        <div class="field"><label>Categoría padre</label>
          <select><option>Ficción</option><option>(Raíz)</option></select>
        </div>
        <div class="field" style="grid-column:1/-1"><label>Descripción</label><textarea rows="3">Obras narrativas extensas de ficción.</textarea></div>
        <div class="field"><label>Estado</label><select><option>Activa</option><option>Inactiva</option></select></div>
      </div>
      <div class="form-actions">
        <button class="btn">Cancelar</button>
        <button class="btn btn-primary">Guardar</button>
      </div>
    </div>
  </div>

  <script src="../assets/shell.js"></script>
</body>
</html>
