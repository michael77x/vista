<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ORIOLE — Libro</title>
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body data-active="books" data-title="Catálogo · Libro" data-depth="1">

  <div class="page-header">
    <div>
      <div class="breadcrumb"><a href="../dashboard.html">Inicio</a> · <a href="books.html">Libros</a> · Editar</div>
      <h1>Editar libro</h1>
    </div>
    <div>
      <button class="btn">Cancelar</button>
      <button class="btn btn-primary">Guardar cambios</button>
    </div>
  </div>

  <div class="row">
    <div class="col" style="min-width:320px">
      <div class="card">
        <h3>Información general</h3>
        <div class="form-grid">
          <div class="field"><label>ISBN *</label><input value="978-84-376-0494-7"><span class="help">13 caracteres, único</span></div>
          <div class="field"><label>SKU interno</label><input value="ORI-0001"></div>
          <div class="field" style="grid-column:1/-1"><label>Título *</label><input value="Cien años de soledad"></div>
          <div class="field"><label>Edición</label><input value="50ª aniversario"></div>
          <div class="field"><label>Año</label><input type="number" value="2017"></div>
          <div class="field"><label>Idioma</label>
            <select><option>Español</option><option>Inglés</option><option>Portugués</option></select>
          </div>
          <div class="field"><label>Páginas</label><input type="number" value="496"></div>
        </div>
      </div>

      <div class="card">
        <h3>Clasificación</h3>
        <div class="form-grid">
          <div class="field"><label>Editorial *</label>
            <select><option>Sudamericana</option><option>Alfaguara</option><option>Anagrama</option></select>
          </div>
          <div class="field"><label>Categoría *</label>
            <select><option>Novela</option><option>Cuento</option><option>Poesía</option></select>
          </div>
          <div class="field" style="grid-column:1/-1">
            <label>Autores *</label>
            <div>
              <span class="chip">Gabriel García Márquez ✕</span>
              <button class="btn btn-sm" type="button">+ Añadir autor</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>Comercial e inventario</h3>
        <div class="form-grid">
          <div class="field"><label>Precio base *</label><input value="25.00"></div>
          <div class="field"><label>Moneda</label><select><option>USD</option><option>EUR</option><option>ARS</option></select></div>
          <div class="field"><label>Stock mínimo</label><input type="number" value="10"></div>
          <div class="field"><label>Stock máximo</label><input type="number" value="200"></div>
          <div class="field"><label>Categoría tributaria</label>
            <select><option>Gravado</option><option>Exonerado</option></select>
          </div>
          <div class="field"><label>Estado</label>
            <select><option>Activo</option><option>Inactivo</option></select>
          </div>
        </div>
      </div>
    </div>

    <div class="col" style="max-width:320px;min-width:280px">
      <div class="card">
        <h3>Portada</h3>
        <div style="border:1px dashed var(--color-border);border-radius:8px;height:280px;display:flex;align-items:center;justify-content:center;background:#f1f5fa;color:var(--color-text-muted)">
          [ Vista previa portada ]
        </div>
        <button class="btn" style="width:100%;justify-content:center;margin-top:12px">Subir imagen</button>
        <p class="text-muted" style="font-size:11px;margin-top:8px">JPG/PNG, máx. 2 MB, recomendado 600×900.</p>
      </div>

      <div class="card">
        <h3>Stock por bodega</h3>
        <table class="data">
          <thead><tr><th>Bodega</th><th class="num">Cant.</th></tr></thead>
          <tbody>
            <tr><td>Central</td><td class="num">3</td></tr>
            <tr><td>Norte</td><td class="num">12</td></tr>
            <tr><td>Sur</td><td class="num">0</td></tr>
          </tbody>
        </table>
        <a href="../inventory/kardex.html" style="font-size:13px">Ver Kardex completo →</a>
      </div>
    </div>
  </div>

  <div class="form-actions">
    <button class="btn btn-danger">Desactivar</button>
    <button class="btn">Cancelar</button>
    <button class="btn btn-primary">Guardar cambios</button>
  </div>

  <script src="../assets/shell.js"></script>
</body>
</html>
