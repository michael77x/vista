<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ORIOLE — Traslado entre bodegas</title>
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body data-active="movements" data-title="Inventario · Traslado" data-depth="1">

  <div class="page-header">
    <div>
      <div class="breadcrumb"><a href="../dashboard.html">Inicio</a> · <a href="movements.html">Movimientos</a> · Traslado</div>
      <h1>Traslado entre bodegas</h1>
    </div>
    <div>
      <button class="btn">Cancelar</button>
      <button class="btn btn-primary">Confirmar traslado</button>
    </div>
  </div>

  <div class="card">
    <h3>Información del traslado</h3>
    <div class="form-grid">
      <div class="field"><label>N° documento</label><input value="TR-2026-0045" disabled></div>
      <div class="field"><label>Fecha *</label><input type="date" value="2026-05-05"></div>
      <div class="field"><label>Bodega ORIGEN *</label>
        <select><option>Central</option><option>Norte</option><option>Sur</option></select>
      </div>
      <div class="field"><label>Bodega DESTINO *</label>
        <select><option>Norte</option><option>Sur</option><option>Central</option></select>
      </div>
      <div class="field" style="grid-column:1/-1"><label>Motivo</label><input value="Reubicación por demanda en sucursal Norte"></div>
    </div>
    <p class="text-muted" style="font-size:12px;margin-top:8px">
      ℹ El sistema generará automáticamente <strong>2 movimientos atómicos</strong>: salida en origen + entrada en destino.
    </p>
  </div>

  <div class="card">
    <h3 style="display:flex;justify-content:space-between">
      Ítems a trasladar <button class="btn btn-primary btn-sm">+ Agregar ítem</button>
    </h3>
    <table class="data">
      <thead>
        <tr>
          <th>ISBN</th><th>Título</th>
          <th class="num">Disp. Origen</th><th class="num">Cantidad</th><th></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><input value="978-987-04-0001-5" style="width:160px"></td>
          <td>Rayuela</td>
          <td class="num">28</td>
          <td class="num"><input type="number" value="10" style="width:80px;text-align:right"></td>
          <td><button class="btn btn-sm btn-danger">✕</button></td>
        </tr>
        <tr>
          <td><input value="978-84-376-0494-7" style="width:160px"></td>
          <td>Cien años de soledad</td>
          <td class="num">3</td>
          <td class="num"><input type="number" value="2" style="width:80px;text-align:right"></td>
          <td><button class="btn btn-sm btn-danger">✕</button></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="form-actions">
    <button class="btn">Cancelar</button>
    <button class="btn btn-primary">Confirmar traslado</button>
  </div>

  <script src="../assets/shell.js"></script>
</body>
</html>
